<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Giriş — Canlı Destek</title>
  <meta name="description" content="Discord hesabınızla giriş yaparak canlı destek hizmetimizden faydalanın." />
  <meta name="theme-color" content="#5865F2" />
  <link rel="preconnect" href="https://fonts.googleapis.com/" />
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d10;
      --card: #111419;
      --border: rgba(255, 255, 255, 0.08);
      --fg: #e5e7eb;
      --muted: #9aa4b2;
      --discord: #5865F2;
      --discord-hover: #4752C4;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo-area {
      text-align: center;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--discord), #9b59b6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 12px 40px rgba(88, 101, 242, 0.3);
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    .logo-area h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-area p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .login-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .login-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .login-card p {
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.5;
    }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      padding: 14px 24px;
      background: var(--discord);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.35);
    }

    .discord-btn:hover {
      background: var(--discord-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(88, 101, 242, 0.45);
    }

    .discord-btn:active {
      transform: translateY(0);
    }

    .discord-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .links a:hover {
      color: var(--fg);
    }

    .footer-note {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

    <div class="logo-area">
      <div class="logo-icon">

        </svg>
      </div>
      <h1>Canlı Destek</h1>
      <p>Discord ile giriş yaparak destek ekibimize ulaşın.</p>
    </div>

    <div class="login-card">
      <h2>Hoş Geldiniz</h2>
      <p>Devam etmek için Discord hesabınızla giriş yapın. Profil bilgileriniz güvenlik amacıyla kullanılacaktır.</p>

        </svg>

      <div class="links">
        <a href="ta-studios.com/canli-destek.html">Canlı Destek</a>
      </div>
    </div>

    <p class="footer-note">Giriş yaparak kullanım şartlarını kabul etmiş olursunuz.</p>
  </div>
</body>

</html>
